plugins {
    id "com.android.library"
}

dependencies {
    if (rootProject.findProject(":HuxerUI") != null) {
        compileOnly project(":HuxerUI")
    } else {
        def sdkHome = providers.environmentVariable("HUXERUI_HOME").get()
        compileOnly files("${sdkHome}/share/huxerui/platform/android/HuxerUI.aar")
    }
}

android {
    namespace = "org.huxerui.lib.localnetwork"
    compileSdk = 37

    defaultConfig {
        minSdk = 23
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}
